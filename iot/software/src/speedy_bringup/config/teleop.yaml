racing_teleop_node:
  ros__parameters:
    axis_steering: 0
    axis_throttle: 4
    axis_brake: 5
    axis_dpad_h: 6
    axis_dpad_v: 7
    cruise_step: 0.1        # m/s por pressão do d-pad (cima/baixo)
    deadzone: 0.05
    # max_steer_angle, max_velocity e wheel_radius são injetados pelo launch a partir do hardware.yaml.
