---
- name: ROS 2 Desktop and Foxglove Studio
  block:
    - name: Install repository dependencies
      ansible.builtin.apt:
        name: [curl, gnupg2, python3-pip]
        state: present
      become: yes

    - name: Import ROS 2 GPG key
      ansible.builtin.shell: |
        curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key -o /usr/share/keyrings/ros-archive-keyring.gpg
      args:
        creates: /usr/share/keyrings/ros-archive-keyring.gpg
      become: yes

    - name: Add ROS 2 APT repository (Noble)
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu noble main"
        state: present
        filename: ros2
      become: yes

    - name: Install ROS 2 Desktop and Foxglove Bridge
      ansible.builtin.apt:
        update_cache: yes
        name:
          - ros-jazzy-desktop
          - ros-jazzy-rmw-cyclonedds-cpp
          - python3-rosdep
          - colcon
          - python3-colcon-ros
          - python3-colcon-common-extensions
        state: present
      become: yes

    - name: Initialize rosdep
      ansible.builtin.command: rosdep init
      register: rosdep_init
      failed_when: false
      changed_when: rosdep_init.rc == 0
      become: yes

    - name: Download Foxglove Studio .deb package
      ansible.builtin.get_url:
        url: https://get.foxglove.dev/desktop/latest/foxglove-studio-latest-linux-amd64.deb
        dest: /tmp/foxglove.deb
        mode: "0644"
      become: no

    - name: Install Foxglove Studio
      ansible.builtin.apt:
        deb: /tmp/foxglove.deb
        state: present
      become: yes

    - name: Remove Foxglove installer
      ansible.builtin.file:
        path: /tmp/foxglove.deb
        state: absent
      become: no
