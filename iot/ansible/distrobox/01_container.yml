---
- name: Create speedy-dev container
  block:
    - name: Ensure base directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ ansible_user_dir }}/.config/distrobox"
        - "{{ ansible_user_dir }}/distrobox/speedy-home"

    - name: Sync dev container profile
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/distrobox-dev.ini"
        dest: "{{ ansible_user_dir }}/.config/distrobox/speedy_dev.ini"
        mode: "0644"

    - name: Set isolated home in dev profile
      ansible.builtin.ini_file:
        path: "{{ ansible_user_dir }}/.config/distrobox/speedy_dev.ini"
        section: "speedy-dev"
        option: "home"
        value: "{{ ansible_user_dir }}/distrobox/speedy-home"
        no_extra_spaces: yes

    - name: Check if dev container exists
      ansible.builtin.command: distrobox list
      register: db_list
      changed_when: false

    # Idempotent; pass -e dev_force_recreate=true for a clean rebuild.
    - name: Assemble dev container
      ansible.builtin.command: >-
        distrobox-assemble create
        {{ '--replace' if (dev_force_recreate | default(false) | bool) else '' }}
        --file {{ ansible_user_dir }}/.config/distrobox/speedy_dev.ini
      when: "'speedy-dev' not in db_list.stdout or (dev_force_recreate | default(false) | bool)"
      register: db_out
      changed_when: "'creating' in db_out.stdout or 'replacing' in db_out.stdout"

    # distrobox enter starts the container if it's Created/stopped.
    - name: Ensure container is running
      ansible.builtin.command:
        cmd: "distrobox enter speedy-dev -- true"
      changed_when: false
