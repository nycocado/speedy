---
- name: 01 - Criar Distrobox de Desenvolvimento (speedy-dev)
  block:
    - name: Garantir diretórios base
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ ansible_user_dir }}/.config/distrobox"
        - "{{ ansible_user_dir }}/distrobox/speedy-home"

    - name: Sincronizar perfil dedicado do distrobox dev
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/distrobox-dev.ini"
        dest: "{{ ansible_user_dir }}/.config/distrobox/speedy_dev.ini"
        mode: '0644'

    - name: Ajustar home isolada no perfil dev
      ansible.builtin.ini_file:
        path: "{{ ansible_user_dir }}/.config/distrobox/speedy_dev.ini"
        section: "speedy-dev"
        option: "home"
        value: "{{ ansible_user_dir }}/distrobox/speedy-home"
        no_extra_spaces: yes

    - name: Verificar se o container de desenvolvimento já existe
      ansible.builtin.command: distrobox list
      register: db_list
      changed_when: false

    - name: Executar distrobox-assemble create (idempotente; -e dev_force_recreate=true força rebuild limpo)
      ansible.builtin.command: >-
        distrobox-assemble create
        {{ '--replace' if (dev_force_recreate | default(false) | bool) else '' }}
        --file {{ ansible_user_dir }}/.config/distrobox/speedy_dev.ini
      when: "'speedy-dev' not in db_list.stdout or (dev_force_recreate | default(false) | bool)"
      register: db_out
      changed_when: "'creating' in db_out.stdout or 'replacing' in db_out.stdout"

    - name: Garantir container iniciado (distrobox enter inicia se estiver em Created/parado)
      ansible.builtin.command:
        cmd: "distrobox enter speedy-dev -- true"
      changed_when: false
