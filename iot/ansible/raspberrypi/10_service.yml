---
- name: 10 - Auto-Start (Serviço Host)
  block:
    - name: Copiar ficheiro de serviço do Speedy
      ansible.builtin.template:
        src: ../files/speedy.service
        dest: /etc/systemd/system/speedy.service
        mode: '0644'
      register: service_file

    - name: Recarregar Systemd
      ansible.builtin.systemd:
        daemon_reload: yes
      when: service_file.changed

    - name: Habilitar serviços no boot
      ansible.builtin.systemd:
        name: speedy
        enabled: yes
        state: restarted
