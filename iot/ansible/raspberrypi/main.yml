---
- name: Speedy robot setup (Raspberry Pi OS Lite + native Rospian)
  hosts: robots
  become: yes
  tasks:
    - name: "01 - Base system"
      ansible.builtin.include_tasks:
        file: 01_base.yml
        apply:
          tags: [base]
      tags: [base]
    - name: "02 - Network and access"
      ansible.builtin.include_tasks:
        file: 02_network.yml
        apply:
          tags: [network]
      tags: [network]
    - name: "03 - Shell and dotfiles"
      ansible.builtin.include_tasks:
        file: 03_shell.yml
        apply:
          tags: [shell]
      tags: [shell]
    - name: "04 - Hardware and overlays"
      ansible.builtin.include_tasks:
        file: 04_hardware.yml
        apply:
          tags: [hardware]
      tags: [hardware]
    - name: "05 - Extra APT packages"
      ansible.builtin.include_tasks:
        file: 05_extra_packages.yml
        apply:
          tags: [packages]
      tags: [packages]
    - name: "06 - Install ROS 2 Jazzy (Rospian)"
      ansible.builtin.include_tasks:
        file: 06_rospian.yml
        apply:
          tags: [ros]
      tags: [ros]
    - name: "07 - Sync workspace"
      ansible.builtin.include_tasks:
        file: 07_workspace.yml
        apply:
          tags: [workspace, deploy]
      tags: [workspace, deploy]
    - name: "08 - Build workspace"
      ansible.builtin.include_tasks:
        file: 08_workspace_build.yml
        apply:
          tags: [build, deploy]
      tags: [build, deploy]
    - name: "09 - Auto-start service"
      ansible.builtin.include_tasks:
        file: 09_service.yml
        apply:
          tags: [service, deploy]
      tags: [service, deploy]
    - name: "10 - Performance tuning"
      ansible.builtin.include_tasks:
        file: 10_performance.yml
        apply:
          tags: [performance]
      tags: [performance]
