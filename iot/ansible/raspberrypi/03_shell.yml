---
- name: Shell and dotfiles
  block:
    - name: Install shell dependencies
      ansible.builtin.apt:
        { name: [zsh, git, curl, wget, psmisc], state: present }

    - name: Install Oh My Zsh
      ansible.builtin.shell: sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
      args: { creates: "/home/{{ ansible_user }}/.oh-my-zsh" }
      become: no

    - name: Clone plugins and theme
      ansible.builtin.git:
        repo: "{{ item.repo }}"
        dest: "/home/{{ ansible_user }}/.oh-my-zsh/custom/{{ item.path }}"
        depth: 1
      loop:
        - {
            repo: "https://github.com/romkatv/powerlevel10k.git",
            path: "themes/powerlevel10k",
          }
        - {
            repo: "https://github.com/zsh-users/zsh-autosuggestions",
            path: "plugins/zsh-autosuggestions",
          }
        - {
            repo: "https://github.com/zsh-users/zsh-syntax-highlighting.git",
            path: "plugins/zsh-syntax-highlighting",
          }
        - {
            repo: "https://github.com/zsh-users/zsh-completions.git",
            path: "plugins/zsh-completions",
          }
      become: no

    - name: Sync dotfiles
      ansible.builtin.copy:
        {
          src: "../files/{{ item }}",
          dest: "/home/{{ ansible_user }}/{{ item }}",
        }
      loop: [.zshrc, .p10k.zsh]
      become: no

    - name: Set default shell
      ansible.builtin.user: { name: "{{ ansible_user }}", shell: /usr/bin/zsh }
