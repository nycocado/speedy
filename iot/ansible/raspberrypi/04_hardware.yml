---
- name: Hardware and peripherals
  block:
    - name: Install hardware tools (dtc, i2c)
      ansible.builtin.apt:
        name: [dphys-swapfile, device-tree-compiler, libi2c-dev, i2c-tools]
        state: present

    # 4GB avoids colcon build running out of memory and locking up.
    - name: Increase swap size to 4GB
      ansible.builtin.lineinfile:
        path: /etc/dphys-swapfile
        regexp: "^#?CONF_SWAPSIZE="
        line: "CONF_SWAPSIZE=4096"
        create: yes

    - name: Remove max swap limit (CONF_MAXSWAP)
      ansible.builtin.lineinfile:
        path: /etc/dphys-swapfile
        regexp: "^#?CONF_MAXSWAP="
        line: "CONF_MAXSWAP=4096"
      register: swap_config

    - name: Set fsck parameters in cmdline.txt
      ansible.builtin.replace:
        path: /boot/firmware/cmdline.txt
        regexp: '^((?!.*\b{{ item }}\b).*)$'
        replace: '\1 {{ item }}'
      loop:
        - "fsck.repair=yes"
        - "fsck.mode=force"

    - name: Apply new swap configuration
      ansible.builtin.shell: |
        dphys-swapfile swapoff
        dphys-swapfile setup
        dphys-swapfile swapon
      when: swap_config.changed

    - name: Configure overlays and parameters in config.txt
      ansible.builtin.lineinfile:
        path: /boot/firmware/config.txt
        line: "{{ item.line }}"
        regexp: "{{ item.regexp | default(omit) }}"
        state: present
      loop:
        - { line: "dtparam=audio=off", regexp: "^dtparam=audio=" }
        - { line: "dtparam=i2c_arm=on", regexp: "^dtparam=i2c_arm=" }
        - { line: "dtparam=spi=off", regexp: "^dtparam=spi=" }
        - { line: "camera_auto_detect=1", regexp: "^camera_auto_detect=" }
        - { line: "dtoverlay=ov5647,cam0", regexp: "^dtoverlay=ov5647" }
        - {
            line: "dtoverlay=pwm-2chan,pin=12,func=4,pin2=13,func2=4",
            regexp: "^dtoverlay=pwm-2chan",
          }

    - name: Load i2c-dev module on boot
      ansible.builtin.lineinfile:
        path: /etc/modules
        line: "i2c-dev"
        state: present

    - name: Configure udev rules for peripherals
      ansible.builtin.copy:
        dest: "/etc/udev/rules.d/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {
            name: "10-ldlidar.rules",
            content: 'KERNEL=="ttyUSB*", ATTRS{idVendor}=="10c4", ATTRS{idProduct}=="ea60", MODE:="0666", GROUP:="dialout", SYMLINK+="ldlidar"',
          }
        - {
            name: "12-pwm.rules",
            content: 'SUBSYSTEM=="pwm", KERNEL=="pwmchip*", ACTION=="add", RUN+="/bin/chgrp -R gpio /sys%p", RUN+="/bin/chmod -R g+w /sys%p"',
          }
        - {
            name: "99-gpio.rules",
            content: 'SUBSYSTEM=="gpio", KERNEL=="gpiochip*", ACTION=="add", GROUP="gpio", MODE="0660"',
          }
        - {
            name: "99-gpiomem.rules",
            content: 'KERNEL=="gpiomem", GROUP="gpio", MODE="0660"',
          }
        - {
            name: "99-i2c.rules",
            content: 'KERNEL=="i2c-[0-9]*", GROUP="i2c", MODE="0660"',
          }
        - {
            name: "99-joy.rules",
            content: 'KERNEL=="js*", MODE="0666", GROUP="input"',
          }

    - name: Ensure gpio group exists
      ansible.builtin.group:
        name: gpio
        state: present

    - name: Add user to hardware groups
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: "dialout,video,i2c,gpio,render,input"
        append: yes

    - name: Reload udev rules
      ansible.builtin.shell: |
        udevadm control --reload-rules
        udevadm trigger
