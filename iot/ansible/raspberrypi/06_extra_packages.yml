- name: 06 - Ferramentas Adicionais de Desenvolvimento
  block:
    - name: Instalar ferramentas de monitoramento e sistema
      ansible.builtin.apt:
        name:
          - build-essential
          - pkg-config
          - s-tui
          - stress
          - htop
          - nvtop
          - tmux
          - nano
          - v4l-utils
          - git
          - python3-pip
        state: present

    - name: Instalar dependências da libcamera (Headless)
      ansible.builtin.apt:
        name:
          - meson
          - cmake
          - ninja-build
          - libyaml-dev
          - python3-yaml
          - python3-ply
          - python3-jinja2
          - libboost-dev
          - libboost-program-options-dev
          - libgnutls28-dev
          - openssl
          - libevent-dev
          - libtiff-dev
          - libglib2.0-dev
          - libgstreamer1.0-dev
          - libgstreamer-plugins-base1.0-dev
          - libpython3-dev
          - pybind11-dev
          - libepoxy-dev
          - libexif-dev
          - libdrm-dev
        state: present

    - name: Instalar Plugins de Imagem do ROS 2
      ansible.builtin.apt:
        name:
          - ros-jazzy-image-transport-plugins
          - ros-jazzy-compressed-image-transport
        state: present