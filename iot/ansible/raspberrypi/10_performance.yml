---
- name: Scheduling and performance tuning
  block:
    # speedy.service keeps LimitRTPRIO for nodes that request real-time priority.
    - name: Allow user group real-time priority and memlock
      ansible.builtin.copy:
        dest: /etc/security/limits.d/99-realtime.conf
        content: |
          @{{ ansible_user }} - rtprio 99
          @{{ ansible_user }} - memlock unlimited
        mode: "0644"
